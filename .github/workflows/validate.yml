name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest rules change under us; a weekly run catches a break
    # that no commit of ours caused.
    - cron: "23 4 * * 1"

jobs:
  tests:
    name: tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `harness` is whatever pytest-homeassistant-custom-component pins;
        # 2026.7.4 is what a real installation is actually running. Testing
        # only the first let a teardown failure through that appeared solely on
        # the second — the suite passed here and errored on the household's own
        # version, which is the version that matters.
        #
        # The Python version is pinned per leg rather than shared: 2026.7
        # will not install on 3.13 at all, so a single python-version would
        # have failed that leg during pip install and reported nothing about
        # the code.
        include:
          - ha: harness
            python: "3.13"
          - ha: "2026.7.4"
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The Home Assistant test harness will not install below this, and
          # several of its dependencies build from source, so the cache earns
          # its keep here.
          python-version: ${{ matrix.python }}
          cache: pip
          # Without this the cache step globs for requirements.txt or
          # pyproject.toml, finds neither, and fails the job before pytest is
          # ever reached — a red build that says nothing about the code.
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Pin the Home Assistant under test
        if: matrix.ha != 'harness'
        run: pip install "homeassistant==${{ matrix.ha }}"
      - run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Only meaningful once the repository is public.
    #
    # Measured on the first run against the private repo: every metadata check
    # passed (license, description, archived, issues, information) and every
    # check that has to read a file failed — hacs.json and the integration
    # manifest both came back as "None". HACS fetches file content over paths
    # that are not authorised for a private repository, so those failures say
    # nothing about the code.
    #
    # The brands check additionally needs the integration listed in
    # home-assistant/brands, which is a submission made when going public.
    #
    # Leaving the job permanently red would train us to ignore it, so it is
    # gated instead. Flipping the repository to public turns it on with no
    # edit here.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
