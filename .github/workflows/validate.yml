name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest rules change under us; a weekly run catches a break
    # that no commit of ours caused.
    - cron: "23 4 * * 1"

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The Home Assistant test harness will not install below this, and
          # several of its dependencies build from source, so the cache earns
          # its keep here.
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Only meaningful once the repository is public.
    #
    # Measured on the first run against the private repo: every metadata check
    # passed (license, description, archived, issues, information) and every
    # check that has to read a file failed — hacs.json and the integration
    # manifest both came back as "None". HACS fetches file content over paths
    # that are not authorised for a private repository, so those failures say
    # nothing about the code.
    #
    # The brands check additionally needs the integration listed in
    # home-assistant/brands, which is a submission made when going public.
    #
    # Leaving the job permanently red would train us to ignore it, so it is
    # gated instead. Flipping the repository to public turns it on with no
    # edit here.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
