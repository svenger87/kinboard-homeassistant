    <path d="M375 96v52" fill="none" stroke="#00bed1" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#link)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 174v169"/>
    <path d="m184 266 115-98"/>
    <path d="m184 266 126 94"/>
  </g>

  <g stroke="#072b55" stroke-width="11">
    <circle cx="174" cy="174" r="28" fill="#f8fbff"/>
    <circle cx="307" cy="163" r="28" fill="#00bed1"/>
    <circle cx="318" cy="365" r="28" fill="#8de3d1"/>
