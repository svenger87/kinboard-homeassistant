<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kinboard Home Assistant integration icon</title>
  <desc id="desc">A Kinboard house containing a connected K monogram.</desc>
  <defs>
    <linearGradient id="house" x1="72" y1="438" x2="430" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071f3d"/>
      <stop offset="1" stop-color="#0d4f96"/>
    </linearGradient>
    <linearGradient id="roof" x1="82" y1="182" x2="429" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1769e0"/>
      <stop offset="1" stop-color="#00bed1"/>
    </linearGradient>
    <linearGradient id="link" x1="172" y1="152" x2="330" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d9f8f2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
