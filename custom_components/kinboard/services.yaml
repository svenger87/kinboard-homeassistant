# Service definitions. Names and fields are the contract frozen by RFC-001
# section 5.2 — an automation written against them must keep working.

add_shopping_item:
  fields:
    name:     { required: true,  selector: { text: } }
    quantity: { required: false, selector: { text: } }
    category: { required: false, selector: { text: } }

create_task:
  fields:
    title:     { required: true,  selector: { text: } }
    person_id: { required: false, selector: { text: } }
    due_at:    { required: false, selector: { datetime: } }
    priority:  { required: false, selector: { number: { min: 0, max: 100 } } }

create_note:
  fields:
    text:       { required: true,  selector: { text: { multiline: true } } }
    expires_at: { required: false, selector: { datetime: } }
    color:      { required: false, selector: { text: } }

show_announcement:
  fields:
    title:          { required: true,  selector: { text: } }
    message:        { required: true,  selector: { text: { multiline: true } } }
    severity:       { required: true,  selector: { select: { options: [info, warning, critical] } } }
    duration:       { required: false, selector: { number: { min: 5, max: 3600, unit_of_measurement: s } } }
    target_devices: { required: false, selector: { text: } }

activate_context:
  fields:
    context_id: { required: true,  selector: { text: } }
    duration:   { required: false, selector: { number: { min: 5, max: 86400, unit_of_measurement: s } } }

# attention_id is optional since 1.1.0: leave it out to dismiss whatever is on
# top, the item binary_sensor.kinboard_attention_required names as `top_key`.
dismiss_attention:
  fields:
    attention_id: { required: false, selector: { text: } }

# Pick the child by their pocket money sensor (entity_id) or pass person_id —
# exactly one. The picker is narrowed by device class, which only these
# sensors carry. `mode: box` because a slider from -1000 to 1000 cannot land on
# 2.50, and the range is a sanity bound for a typo, not a policy.
add_pocket_money:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: kinboard
            domain: sensor
            device_class: monetary
    person_id: { required: false, selector: { text: } }
    amount:    { required: true,  selector: { number: { min: -1000, max: 1000, step: 0.01, mode: box } } }
    reason:    { required: true,  selector: { text: } }

refresh_integration:
  fields:
    integration_id: { required: true, selector: { text: } }

# Kinboard 1.13.0-rc.6 or newer; the token needs announcements:write. A
# doorbell set on the camera in Kinboard does this by itself — this action is
# for everything else (motion, an alarm, a button on a dashboard).
show_camera:
  fields:
    camera:         { required: true,  selector: { text: } }
    duration:       { required: false, selector: { number: { min: 5, max: 300, unit_of_measurement: s } } }
    target_devices: { required: false, selector: { text: { multiple: true } } }

# Kinboard newer than 1.13.0-rc.14; the token needs pocket_money:write. It
# only asks, as the child's own "Redeem" does: a parent approves or declines
# it on Kinboard with the settings PIN.
request_reward:
  fields:
    child:  { required: true, selector: { text: } }
    reward: { required: true, selector: { text: } }
